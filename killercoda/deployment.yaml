apiVersion: apps/v1
kind: Deployment
metadata:
  name: picas-y-fijas
  namespace: picas-y-fijas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: picas-y-fijas
  template:
    metadata:
      labels:
        app: picas-y-fijas
    spec:
      volumes:
        - name: source
          emptyDir: {}
      initContainers:
        - name: download-code
          image: alpine/git:latest
          command: ["/bin/sh", "-ec"]
          args:
            - |
              git init /source/repo
              git -C /source/repo fetch --depth=1 https://github.com/jdjimenez1215/Picas-y-fijas.git HEAD
              git -C /source/repo reset --hard FETCH_HEAD
          volumeMounts:
            - name: source
              mountPath: /source
      containers:
        - name: web
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /source/repo
          command: ["/bin/sh", "-ec"]
          args:
            - |
              pip install --no-cache-dir -r requirements.txt gunicorn==23.0.0
              exec gunicorn --bind 0.0.0.0:5000 --workers 1 run:app
          volumeMounts:
            - name: source
              mountPath: /source
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
